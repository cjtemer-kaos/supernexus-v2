<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lethal Flake - Avatar</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { 
        background: #0a0a0f; 
        color: #e4e4e7; 
        font-family: "Inter", sans-serif;
        overflow: hidden;
      }
      #avatar-container {
        width: 100vw;
        height: 100vh;
        position: relative;
      }
      #avatar-container canvas {
        width: 100% !important;
        height: 100% !important;
      }
      .status-bar {
        position: absolute;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        background: rgba(10, 10, 15, 0.85);
        backdrop-filter: blur(8px);
        border-radius: 24px;
        font-size: 13px;
        color: #a1a1aa;
        border: 1px solid #27272a;
      }
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #8b5cf6;
      }
      .status-dot.speaking {
        background: #f97316;
        animation: pulse 0.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
      .ptt-hint {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 12px;
        background: rgba(10, 10, 15, 0.85);
        backdrop-filter: blur(8px);
        border-radius: 16px;
        font-size: 12px;
        color: #a1a1aa;
        border: 1px solid #27272a;
      }
    </style>
  </head>
  <body>
    <div id="avatar-container"></div>
    <div class="ptt-hint">Mantén ESPACIO para hablar</div>
    <div class="status-bar">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">Listo</span>
    </div>
    <script type="module" src="/src/avatar.tsx"></script>
  </body>
</html>
